name: Publish Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pre-installed Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          sudo chown -R "$USER:$USER" "$SDK_ROOT" || true
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Found sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystores & Config
        id: signing_check
        env:
          DEBUG_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_SECRET" ]; then
            echo "$DEBUG_KEYSTORE_SECRET" | tr -d '[:space:]' | base64 -d > debug.keystore
            KEY_SOURCE="GitHub Secret (DEBUG_KEYSTORE_BASE64)"
          elif [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            KEY_SOURCE="Workspace debug.keystore.base64 (Firebase Registered)"
          elif [ -f ".github/debug-signing.b64" ]; then
            tr -d '[:space:]' < .github/debug-signing.b64 | base64 -d > debug.keystore
            KEY_SOURCE="CI Registered Debug Keystore (.github/debug-signing.b64)"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            KEY_SOURCE="Temporary CI Keystore (NOT registered in Firebase — add SHA-1 below in Firebase Console or set DEBUG_KEYSTORE_BASE64 secret for Google Sign-In)"
          else
            KEY_SOURCE="Existing debug.keystore"
          fi

          {
            echo "### APK Signing & Google Sign-In Info"
            echo "- **Debug Keystore Source:** $KEY_SOURCE"
            echo '```'
            keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "demo-no-project",
              "storage_bucket": "demo-no-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.aistudio.mayaagent.vxrkqm"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "123456789000-ciwebclient.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyCiKeyForVerification00000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          if [ ! -f "app/src/main/res/values/firebase_applet_config.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-maya-442da1eb-4eff-4650-a527-f7175f988a86</string>
              <string name="recaptcha_site_key" translatable="false">ci-dummy-recaptcha-key</string>
          </resources>
          EOF
          fi

          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          if [ -n "$RELEASE_KEYSTORE_SECRET" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_SECRET" | tr -d '[:space:]' | base64 -d > my-upload-key.jks
            echo "has_release_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Release Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          mkdir -p dist
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Maya-${{ steps.meta.outputs.tag }}-debug.apk"

      - name: Build Signed Release APK & Play Bundle (if Release Secrets set)
        if: steps.signing_check.outputs.has_release_key == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "dist/Maya-${{ steps.meta.outputs.tag }}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Maya-${{ steps.meta.outputs.tag }}-release.aab"
          rm -f my-upload-key.jks

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Maya ${{ steps.meta.outputs.tag }}
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          files: dist/*
