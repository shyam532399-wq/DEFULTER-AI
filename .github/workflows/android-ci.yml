name: Android CI — Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Firestore Rules, Robolectric Tests & Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22 (for Firebase Emulators & Rules Tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore & Optional Firebase Config
        env:
          DEBUG_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_SECRET" ]; then
            echo "$DEBUG_KEYSTORE_SECRET" | tr -d '[:space:]' | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
          fi

          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Run Firestore Security Rules & Robolectric Unit/CUJ Tests
        run: |
          npm install --no-save firebase-tools @firebase/rules-unit-testing
          npx firebase emulators:exec \
            --only auth,firestore \
            --project demo-no-project \
            "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 node --test firestore.test.js && gradle :app:testDebugUnitTest --no-daemon"
          rm -rf node_modules package-lock.json firestore-debug.log firebase-debug.log

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maya-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
