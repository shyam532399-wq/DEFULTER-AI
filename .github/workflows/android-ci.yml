name: Android CI — Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Firestore Rules, Robolectric Tests & Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22 (for Firebase Emulators & Rules Tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Pre-installed Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          sudo chown -R "$USER:$USER" "$SDK_ROOT" || true
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Found sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore & Firebase Config
        env:
          DEBUG_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_SECRET" ]; then
            echo "$DEBUG_KEYSTORE_SECRET" | tr -d '[:space:]' | base64 -d > debug.keystore
            KEY_SOURCE="GitHub Secret (DEBUG_KEYSTORE_BASE64)"
          elif [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            KEY_SOURCE="Workspace debug.keystore.base64 (Firebase Registered)"
          elif [ -f ".github/debug-signing.b64" ]; then
            tr -d '[:space:]' < .github/debug-signing.b64 | base64 -d > debug.keystore
            KEY_SOURCE="CI Registered Debug Keystore (.github/debug-signing.b64)"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            KEY_SOURCE="Temporary CI Keystore (NOT registered in Firebase — add SHA-1 below in Firebase Console or set DEBUG_KEYSTORE_BASE64 secret for Google Sign-In)"
          else
            KEY_SOURCE="Existing debug.keystore"
          fi

          {
            echo "### APK Signing & Google Sign-In Info"
            echo "- **Keystore Source:** $KEY_SOURCE"
            echo '```'
            keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "demo-no-project",
              "storage_bucket": "demo-no-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.aistudio.mayaagent.vxrkqm"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "123456789000-ciwebclient.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyCiKeyForVerification00000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          if [ ! -f "app/src/main/res/values/firebase_applet_config.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-maya-442da1eb-4eff-4650-a527-f7175f988a86</string>
              <string name="recaptcha_site_key" translatable="false">ci-dummy-recaptcha-key</string>
          </resources>
          EOF
          fi

          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Run Firestore Security Rules & Robolectric Unit/CUJ Tests
        run: |
          npm install --no-save firebase-tools@15 @firebase/rules-unit-testing@5
          ./node_modules/.bin/firebase emulators:exec \
            --only auth,firestore \
            --project demo-no-project \
            "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 node --test firestore.test.js && gradle :app:testDebugUnitTest --no-daemon"
          rm -rf node_modules package-lock.json firestore-debug.log firebase-debug.log

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maya-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
